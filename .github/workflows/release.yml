# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# A tag v<major>.<minor>.<patch> builds and packages Pocket Reference on each
# host (build.yml) and attaches the downloads to the tag's GitHub release:
# a macOS zip, a Windows zip and Linux archives.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Match the tag to the project version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release: the tag $TAG is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          if ! grep -q "^project(PocketReference VERSION $version " CMakeLists.txt; then
            echo "release: CMakeLists.txt's project version is not $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      package: true
      version: ${{ needs.version.outputs.version }}
  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pocket-reference-*
          merge-multiple: true
          path: dist
      - name: Attach the downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Pocket Reference $VERSION" --notes ""
          fi
